# 项目级 cargo 配置。
#
# 这里不钉产物目录：GitHub Actions 的 runner 没有 E: 盘，钉在这里会让 CI 全挂。
# 缺省就是 cargo 自己的 <仓库根>/target，与 scripts/build.sh、scripts/build.ps1、
# scripts/clean.sh、scripts/clean.ps1 四侧推导的缺省值同一条规则（它们只在环境变量
# 没给时才填这个值，给了就按给的走）。手动跑 cargo 不用带任何环境变量。
# 想把产物挪出仓库（例如系统盘吃紧）就自己 export CARGO_TARGET_DIR，四个脚本都跟随它。

[net]
git-fetch-with-cli = true
